name: Skill index and gallery

# AllyHub's skill index (the Agent Skills discovery standard) and the
# gallery (apps/skills), built from skills/ and content/skills/ on every
# change and deployed as a Cloudflare Worker on allyhub.com/skills/ and
# allyhub.com/.well-known/agent-skills/. A pull request builds them and
# checks the Worker's deploy without making it, so a skill or a page with a
# problem never ships.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token that can edit
# Workers and their routes on allyhub.com's zone) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths: ["skills/**", "content/**", "apps/skills/**", ".github/workflows/gallery.yml"]
  pull_request:
    paths: ["skills/**", "content/**", "apps/skills/**", ".github/workflows/gallery.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/skills
    steps:
      - uses: actions/checkout@v6
        with:
          # Each page's last update comes from git.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/skills/package-lock.json
      - run: npm ci
      - name: Check and index the skills
        run: npm run index
      - name: Build the gallery
        run: npm run build
      - name: Check the Worker
        if: github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run
      - name: Deploy the Worker
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
