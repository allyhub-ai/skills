name: Skill index and gallery

# AllyHub's skill index (the Agent Skills discovery standard) and its
# gallery, built from skills/ on every change and served by GitHub Pages;
# allyhub.com forwards /.well-known/agent-skills/ and /skills/ to them.
# A pull request builds them only, so a skill with a problem never ships.

on:
  push:
    branches: [main]
    paths: ["skills/**", "scripts/site.mjs", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["skills/**", "scripts/site.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The CLI whose `allyhub skill index` checks and packs the skills.
  ALLYHUB_VERSION: "0.1.0-alpha.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check and index the skills
        run: npx -y "allyhub@$ALLYHUB_VERSION" skill index skills --out site/well-known/agent-skills
      - name: Draw the gallery
        run: node scripts/site.mjs site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
