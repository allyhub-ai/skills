name: Skill index and gallery

# AllyHub's skill index (the Agent Skills discovery standard) and the
# gallery (apps/skills), built from skills/ and content/skills/ on every
# change and served by GitHub Pages; allyhub.com forwards
# /.well-known/agent-skills/ and /skills/ to them. A pull request builds
# them only, so a skill or a page with a problem never ships.

on:
  push:
    branches: [main]
    paths: ["skills/**", "content/**", "apps/skills/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["skills/**", "content/**", "apps/skills/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/skills
    steps:
      - uses: actions/checkout@v6
        with:
          # Each page's last update comes from git.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/skills/package-lock.json
      - run: npm ci
      - name: Check and index the skills
        run: npm run index
      - name: Build the gallery
        run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/skills/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
